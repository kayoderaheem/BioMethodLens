[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biomethodlens"
version = "0.1.0"
description = "Evidence-linked specialist review for bioinformatics manuscripts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kayode Raheem", email = "47569280+kayoderaheem@users.noreply.github.com"}]
keywords = ["bioinformatics", "peer-review", "reproducibility", "omics", "scientific-writing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kayoderaheem/BioMethodLens"
Repository = "https://github.com/kayoderaheem/BioMethodLens"
Issues = "https://github.com/kayoderaheem/BioMethodLens/issues"

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
dev = ["coverage>=7.0", "jsonschema>=4.21", "ruff>=0.8"]

[project.scripts]
biomethodlens = "biomethodlens.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/biomethodlens/config" = ["config/*.json"]
"share/biomethodlens/schemas" = ["schemas/*.json"]
"share/biomethodlens/prompts/reviewers" = ["prompts/reviewers/*.md"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035"]
